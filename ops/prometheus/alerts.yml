# Alarmregeln (REQ-OPS-008, Nachweis CTRL-ALERT-RULES; Tabelle in docs/07-betrieb/monitoring-alarmierung.md)
# Alarme auf Symptome, die eine handelnde Person brauchen; jede Regel verweist auf ihr Runbook.
# Schwellwerte sind Beispielwerte und werden nach den ersten Betriebswochen angepasst.
groups:
  - name: campusmarkt
    rules:
      - alert: AppDown
        expr: up{job="campusmarkt"} == 0
        for: 2m
        labels:
          severity: SEV-1
        annotations:
          summary: CampusMarkt ist nicht erreichbar
          description: Prometheus erreicht app:8080/metrics seit 2 Minuten nicht (REQ-OPS-001).
          runbook_url: https://github.com/CaRo10Robert/SWeng_projekt2026/blob/main/docs/07-betrieb/incident-prozess.md

      - alert: NotReady
        expr: app_ready == 0
        for: 5m
        labels:
          severity: SEV-1
        annotations:
          summary: CampusMarkt meldet „nicht bereit“
          description: Die Readiness-Prüfung schlägt seit 5 Minuten fehl, meist ist die Datenbank nicht erreichbar (REQ-OPS-001).
          runbook_url: https://github.com/CaRo10Robert/SWeng_projekt2026/blob/main/docs/07-betrieb/betriebshandbuch.md

      - alert: HighErrorRate
        expr: |
          sum(rate(http_request_duration_seconds_count{job="campusmarkt",status=~"5.."}[5m]))
            / sum(rate(http_request_duration_seconds_count{job="campusmarkt"}[5m])) > 0.05
        for: 5m
        labels:
          severity: SEV-2
        annotations:
          summary: Mehr als 5 % der Anfragen enden mit 5xx
          description: 'Fehlerquote {{ $value | humanizePercentage }} über 5 Minuten (REQ-AVAIL-001).'
          runbook_url: https://github.com/CaRo10Robert/SWeng_projekt2026/blob/main/docs/07-betrieb/incident-prozess.md

      - alert: SlowSearch
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(http_request_duration_seconds_bucket{job="campusmarkt",method="GET",route="/api/v1/listings"}[10m]))
          ) > 0.5
        for: 10m
        labels:
          severity: SEV-3
        annotations:
          summary: Suche langsam (p95 > 500 ms)
          description: 'p95 der Suche {{ $value | humanizeDuration }} über 10 Minuten (QS-7, REQ-PERF-001).'
          runbook_url: https://github.com/CaRo10Robert/SWeng_projekt2026/blob/main/docs/07-betrieb/monitoring-alarmierung.md

      - alert: JobFailures
        expr: increase(jobs_processed_total{job="campusmarkt",outcome="error"}[15m]) > 0
        labels:
          severity: SEV-3
        annotations:
          summary: 'Fehlgeschlagene Jobs in Queue {{ $labels.queue }}'
          description: 'In den letzten 15 Minuten sind Jobs fehlgeschlagen, z. B. Mailversand (QS-3, REQ-NOTI-005).'
          runbook_url: https://github.com/CaRo10Robert/SWeng_projekt2026/blob/main/docs/07-betrieb/betriebshandbuch.md

      - alert: WebSocketDrop
        # Einbruch um mehr als 80 % gegenüber vor 5 Minuten; erst ab 5 Verbindungen, damit die Demo nicht dauernd alarmiert
        expr: ws_connections{job="campusmarkt"} < 0.2 * (ws_connections{job="campusmarkt"} offset 5m) and (ws_connections{job="campusmarkt"} offset 5m) >= 5
        labels:
          severity: SEV-2
        annotations:
          summary: WebSocket-Verbindungen eingebrochen
          description: Die Zahl offener WebSocket-Verbindungen ist in 5 Minuten um mehr als 80 % gefallen (QS-4, REQ-CHAT-003).
          runbook_url: https://github.com/CaRo10Robert/SWeng_projekt2026/blob/main/docs/07-betrieb/incident-prozess.md

      - alert: MaintenanceModeOn
        expr: campusmarkt_maintenance_mode == 1
        for: 2h
        labels:
          severity: SEV-3
        annotations:
          summary: Wartungsmodus länger als 2 Stunden aktiv
          description: Der Wartungsmodus ist seit mehr als 2 Stunden aktiv – geplantes Ende prüfen (REQ-OPS-006).
          runbook_url: https://github.com/CaRo10Robert/SWeng_projekt2026/blob/main/docs/07-betrieb/wartung-statusseite.md

      - alert: BackupMissing
        # 0 = noch nie gesichert
        expr: time() - campusmarkt_backup_last_success_timestamp_seconds{job="campusmarkt"} > 26 * 3600
        labels:
          severity: SEV-2
        annotations:
          summary: Letzte erfolgreiche Sicherung älter als 26 Stunden
          description: 'Die letzte Sicherung ist {{ $value | humanizeDuration }} alt (REQ-AVAIL-003).'
          runbook_url: https://github.com/CaRo10Robert/SWeng_projekt2026/blob/main/docs/07-betrieb/backup-restore.md
