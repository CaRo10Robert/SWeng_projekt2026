# Regeltests: promtool test rules ops/prometheus/alerts.test.yml (CTRL-ALERT-RULES)
rule_files:
  - alerts.yml

evaluation_interval: 1m

tests:
  - name: AppDown nach 2 Minuten
    interval: 1m
    input_series:
      - series: 'up{job="campusmarkt", instance="app:8080"}'
        values: '1 0 0 0 0'
    alert_rule_test:
      - eval_time: 2m
        alertname: AppDown
        exp_alerts: []
      - eval_time: 4m
        alertname: AppDown
        exp_alerts:
          - exp_labels: { severity: SEV-1, job: campusmarkt, instance: 'app:8080' }
            exp_annotations:
              summary: CampusMarkt ist nicht erreichbar
              description: Prometheus erreicht app:8080/metrics seit 2 Minuten nicht (REQ-OPS-001).
              runbook_url: https://github.com/CaRo10Robert/SWeng_projekt2026/blob/main/docs/07-betrieb/incident-prozess.md

  - name: BackupMissing bei Sicherung älter als 26 Stunden
    interval: 1h
    input_series:
      # Sicherung eine Stunde nach Start (Zeitstempel 3600), danach keine neue
      - series: 'campusmarkt_backup_last_success_timestamp_seconds{job="campusmarkt", instance="app:8080"}'
        values: '3600x30'
      - series: 'process_start_time_seconds{job="campusmarkt", instance="app:8080"}'
        values: '0x30'
    alert_rule_test:
      - eval_time: 26h
        alertname: BackupMissing
        exp_alerts: []
      - eval_time: 28h
        alertname: BackupMissing
        exp_alerts:
          - exp_labels: { severity: SEV-2, job: campusmarkt, instance: 'app:8080' }
            exp_annotations:
              summary: Seit mehr als 26 Stunden keine erfolgreiche Sicherung
              description: Seit 1d 3h 0m 0s keine erfolgreiche Sicherung (REQ-AVAIL-003).
              runbook_url: https://github.com/CaRo10Robert/SWeng_projekt2026/blob/main/docs/07-betrieb/backup-restore.md

  # NaN (Wert nicht lesbar) lässt sich in promtool-Serien nicht angeben; Vergleiche mit NaN sind immer falsch.
  - name: BackupMissing nie gesichert erst nach 26 Stunden Laufzeit
    interval: 1h
    input_series:
      - series: 'campusmarkt_backup_last_success_timestamp_seconds{job="campusmarkt", instance="app:8080"}'
        values: '0x30'
      - series: 'process_start_time_seconds{job="campusmarkt", instance="app:8080"}'
        values: '0x30'
    alert_rule_test:
      - eval_time: 1h
        alertname: BackupMissing
        exp_alerts: []
      - eval_time: 27h
        alertname: BackupMissing
        exp_alerts:
          - exp_labels: { severity: SEV-2, job: campusmarkt, instance: 'app:8080' }
            exp_annotations:
              summary: Seit mehr als 26 Stunden keine erfolgreiche Sicherung
              description: Seit 1d 3h 0m 0s keine erfolgreiche Sicherung (REQ-AVAIL-003).
              runbook_url: https://github.com/CaRo10Robert/SWeng_projekt2026/blob/main/docs/07-betrieb/backup-restore.md

  - name: HighErrorRate nicht im Wartungsmodus und nicht bei geringer Last
    interval: 1m
    input_series:
      # Wartung: 100 % 503 bei viel Verkehr
      - series: 'http_request_duration_seconds_count{job="campusmarkt", method="GET", route="/", status="503"}'
        values: '0+100x20'
      - series: 'campusmarkt_maintenance_mode{job="campusmarkt", instance="app:8080"}'
        values: '1x20'
    alert_rule_test:
      - eval_time: 15m
        alertname: HighErrorRate
        exp_alerts: []

  - name: HighErrorRate erst ab Mindestlast
    interval: 1m
    input_series:
      # 1 Fehler je 5 Minuten bei kaum Verkehr: Quote hoch, Last unter 0,1/s
      - series: 'http_request_duration_seconds_count{job="campusmarkt", method="GET", route="/api/v1/listings", status="500"}'
        values: '0+0.2x20'
      - series: 'campusmarkt_maintenance_mode{job="campusmarkt", instance="app:8080"}'
        values: '0x20'
    alert_rule_test:
      - eval_time: 15m
        alertname: HighErrorRate
        exp_alerts: []

  - name: HighErrorRate bei echter Störung
    interval: 1m
    input_series:
      - series: 'http_request_duration_seconds_count{job="campusmarkt", method="GET", route="/api/v1/listings", status="500"}'
        values: '0+60x20'
      - series: 'http_request_duration_seconds_count{job="campusmarkt", method="GET", route="/api/v1/listings", status="200"}'
        values: '0+60x20'
      - series: 'campusmarkt_maintenance_mode{job="campusmarkt", instance="app:8080"}'
        values: '0x20'
    alert_rule_test:
      - eval_time: 15m
        alertname: HighErrorRate
        exp_alerts:
          - exp_labels: { severity: SEV-2 }
            exp_annotations:
              summary: Mehr als 5 % der Anfragen enden mit 5xx
              description: 'Fehlerquote 50% über 5 Minuten (REQ-AVAIL-001).'
              runbook_url: https://github.com/CaRo10Robert/SWeng_projekt2026/blob/main/docs/07-betrieb/incident-prozess.md

  - name: JobFailures nur für endgültig gescheiterte Jobs
    interval: 1m
    input_series:
      - series: 'jobs_processed_total{job="campusmarkt", instance="app:8080", queue="send-email", outcome="retry"}'
        values: '0+5x20'
      - series: 'jobs_processed_total{job="campusmarkt", instance="app:8080", queue="send-email", outcome="dead"}'
        values: '0x10 1x10'
    alert_rule_test:
      - eval_time: 9m
        alertname: JobFailures
        exp_alerts: []
      - eval_time: 12m
        alertname: JobFailures
        exp_alerts:
          - exp_labels: { severity: SEV-3, job: campusmarkt, instance: 'app:8080', queue: send-email, outcome: dead }
            exp_annotations:
              summary: 'Endgültig gescheiterte Jobs in Queue send-email'
              description: 'In den letzten 15 Minuten sind Jobs nach allen Wiederholungen gescheitert und liegen in der Dead-Letter-Queue, z. B. Mailversand (QS-3, REQ-NOTI-005).'
              runbook_url: https://github.com/CaRo10Robert/SWeng_projekt2026/blob/main/docs/07-betrieb/betriebshandbuch.md

  - name: Keine Fehlalarme bei gesunder App
    interval: 1m
    input_series:
      - series: 'http_request_duration_seconds_count{job="campusmarkt", method="GET", route="/api/v1/listings", status="200"}'
        values: '0+100x20'
      - series: 'http_request_duration_seconds_count{job="campusmarkt", method="GET", route="/api/v1/listings", status="500"}'
        values: '0+1x20'
    alert_rule_test:
      - eval_time: 15m
        alertname: HighErrorRate
        exp_alerts: []
