# Mutationstests der Geschäftsregeln (CTRL-MUTATION, REQ-MAINT-001): wöchentlich und auf Anforderung,
# nicht bei jedem Push, weil ein Lauf deutlich länger dauert als die Unit-Tests.
name: Mutation

on:
  schedule:
    - cron: '0 3 * * 1' # montags 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutation:
    name: StrykerJS auf domain.ts (Schwelle 60 %)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @campusmarkt/contracts build
      - run: pnpm --filter @campusmarkt/server test:mutation
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: mutation-report
          path: apps/server/reports/mutation
          retention-days: 30
