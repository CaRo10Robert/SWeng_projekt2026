# Langlaufende Betriebs- und Qualitätsprüfungen: wöchentlich und auf Anforderung, nicht bei jedem Push.
# - CTRL-DLQ (REQ-NOTI-005): etwa 5 min Warten auf die endgültig gescheiterte Zustellung
# - DAST mit ZAP-Baseline (Guideline Kap. 07 „Verification cadence“, GL-13, MAN-SEC-001)
# - Lasttests mit k6 (REQ-PERF-001…004, Guideline Kap. 09, GL-11): je Szenario 5 min Dauerlast
name: Ops wöchentlich

on:
  schedule:
    - cron: '0 4 * * 1' # montags 04:00 UTC
  workflow_dispatch:

permissions:
  contents: read

env:
  ZAP_IMAGE: ghcr.io/zaproxy/zaproxy:2.16.1@sha256:7840969c7c9fead565bf9734b12f49f6886db90b1d35b1f74d79710bbd081dab # renovate: datasource=docker

jobs:
  dlq:
    name: Dead-Letter-Ansicht bei Mailausfall (CTRL-DLQ)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Compose-Setup starten
        run: docker compose up --build -d --wait
      - name: Mailpit stoppen, Zustellung bis „dead“ laufen lassen, Admin-Ansicht prüfen
        run: node tests/ops/dlq-test.mjs http://localhost:8080
      - name: Logs bei Fehler
        if: failure()
        run: docker compose logs --no-color app | tail -200

  zap:
    name: DAST – ZAP-Baseline gegen das Docker-Beispiel (GL-13)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Compose-Setup starten
        run: docker compose up --build -d --wait
      - name: ZAP-Baseline mit Regeln aus ops/zap/baseline.conf (jede nicht ausgenommene Regel ist FAIL)
        run: |
          mkdir -p zap-report && cp ops/zap/baseline.conf zap-report/ && chmod -R a+rwX zap-report
          docker run --rm --network host -v "$PWD/zap-report:/zap/wrk:rw" "$ZAP_IMAGE" \
            zap-baseline.py -t http://localhost:8080 -c baseline.conf -J zap-baseline.json -r zap-baseline.html -I
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: zap-baseline
          path: zap-report
          retention-days: 30

  load:
    name: Lasttests k6 (AT-PERF-001…004)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Compose-Setup mit angehobenen Rate-Limits starten (nur Demo-Modus, REQ-PERF-002/-004)
        run: docker compose up --build -d --wait
        env:
          RATE_LIMIT_FACTOR: '100'
      - name: Suche, Chat, Anzeige anlegen, Registrierung (je 5 min; Seed auf 10.000 Anzeigen)
        run: node tests/load/run.mjs all
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: k6-results
          path: tests/load/results
          retention-days: 30
      - name: Logs bei Fehler
        if: failure()
        run: docker compose logs --no-color app | tail -200
