# Lokale Entwicklung: nur Postgres + Mailpit, die App läuft per `pnpm dev` mit Hot Reload.
#   docker compose -f compose.dev.yaml up -d
# Ports nur lokal und per Variable änderbar (MAN-PORT-001 P-1). Bei geändertem DEV_DB_PORT bzw. DEV_SMTP_PORT
# DATABASE_URL bzw. SMTP_PORT für `pnpm dev` entsprechend setzen (z. B. in apps/server/.env).
name: campusmarkt-dev

services:
  db:
    image: postgres:17-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
    environment:
      POSTGRES_USER: campusmarkt
      POSTGRES_PASSWORD: campusmarkt
      POSTGRES_DB: campusmarkt
    ports:
      - "127.0.0.1:${DEV_DB_PORT:-5432}:5432"
    volumes:
      - pgdata-dev:/var/lib/postgresql/data

  mailpit:
    image: axllent/mailpit:v1.27@sha256:e22dce5b36f93c77082e204a3942fb6b283b7896e057458400a4c88344c3df68
    ports:
      - "127.0.0.1:${DEV_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${DEV_MAILPIT_PORT:-8025}:8025"

volumes:
  pgdata-dev:
