# Lokale Entwicklung: nur Postgres + Mailpit, die App läuft per `pnpm dev` mit Hot Reload.
#   docker compose -f compose.dev.yaml up -d
name: campusmarkt-dev

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: campusmarkt
      POSTGRES_PASSWORD: campusmarkt
      POSTGRES_DB: campusmarkt
    ports:
      - "5432:5432"
    volumes:
      - pgdata-dev:/var/lib/postgresql/data

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pgdata-dev:
